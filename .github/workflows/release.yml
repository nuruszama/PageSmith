name: Build Portable Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: PageSmith.exe
            built_path: dist/PageSmith.exe
          - os: ubuntu-latest
            artifact_name: PageSmith-Linux-x86_64
            built_path: dist/PageSmith

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Qt/XCB runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Windows ICO and Compile Binary
        shell: bash
        run: |
          ICON_ARGS=""
          if [ -f "assets/icon.png" ]; then
            python -c "from PIL import Image; img = Image.open('assets/icon.png'); img.save('assets/icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              ICON_ARGS="--icon=assets/icon.ico --add-data assets/icon.png;assets"
            else
              ICON_ARGS="--add-data assets/icon.png:assets"
            fi
          fi
          pyinstaller --noconfirm --windowed --onefile --clean $ICON_ARGS --name PageSmith main.py

      - name: Move binary for release
        shell: bash
        run: |
          mv "${{ matrix.built_path }}" "${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "PageSmith ${{ steps.tag.outputs.name }}"
          draft: false
          prerelease: false
          files: release-files/*
